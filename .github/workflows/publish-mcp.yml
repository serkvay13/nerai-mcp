# Publishes this server to the official MCP Registry
# (registry.modelcontextprotocol.io) using GitHub OIDC — no secrets needed:
# the workflow proves repo ownership, which grants the io.github.serkvay13
# namespace. Run manually from the Actions tab, or push a v* tag.
name: Publish to MCP Registry
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Login (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish
